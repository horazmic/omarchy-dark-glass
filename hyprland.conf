# Obsidian glass borders
$active      = rgba(ffffff55)
$inactive    = rgba(ffffff18)

general {
    gaps_in = 2
    gaps_out = 4
    border_size = 1

    col.active_border = $active
    col.inactive_border = $inactive

    layout = dwindle
}

decoration {
    rounding = 10

    active_opacity = 0.95
    inactive_opacity = 0.90
    
    blur {
        enabled = true
        size = 4
        passes = 3
        ignore_opacity = true
        new_optimizations = true
    }

    shadow {
        enabled = true
        range = 15
        render_power = 3
        color = rgba(00000055)
    }
}

animations {
    enabled = yes

    animation = windows,     1, 2, default
    animation = windowsOut,  1, 2, default, popin 80%
    animation = windowsMove, 1, 2, default

    animation = border,      1, 2, default
    animation = fade,        1, 3, default

    animation = workspaces,  1, 2, default, slide
}

; layerrule = blur on, match:namespace waybar
layerrule = ignore_alpha 0, match:namespace waybar

layerrule = blur on, match:namespace walker
layerrule = ignore_alpha 0, match:namespace walker

layerrule = blur on, match:namespace notifications
layerrule = ignore_alpha 0, match:namespace notifications

layerrule = blur on, match:namespace swayosd
layerrule = ignore_alpha 0, match:namespace swayosd

# --- OBSIDIAN GLASS COLORS ---
# Pure whites and deep blacks for that liquid crystal look
foreground #ffffff
background #0f0f0f
selection_foreground #ffffff
selection_background #333333

cursor #ffffff
cursor_text_color #000000

# Glowing borders to match Walker's edges
active_border_color #444444
inactive_border_color #1a1a1a

# --- LIQUID GLASS EFFECTS ---
# Lowering opacity slightly more to emphasize the blur
background_opacity 0.75
dynamic_background_opacity yes

# Increased padding to match the "floating" feel of the modules
window_padding_width 20

# --- TAB BAR (LIQUID PILL STYLE) ---
tab_bar_margin_width      10
tab_bar_margin_height     10 0
tab_bar_style             separator
tab_separator             ""
active_tab_font_style     bold
active_tab_foreground     #ffffff
active_tab_background     #333333
inactive_tab_foreground   #666666
inactive_tab_background   #151515

# --- TERMINAL COLORS (MONOCHROME ACCENTS) ---
# Keeping the colors but desaturating them slightly for the "Obsidian" look
color0 #1a1a1a
color1 #ff5555
color2 #50fa7b
color3 #f1fa8c
color4 #8be9fd
color5 #bd93f9
color6 #8be9fd
color7 #ffffff
color8 #4d4d4d
color9 #ff6e6e
color10 #69ff94
color11 #ffffa5
color12 #d6acff
color13 #ff92df
color14 #a4ffff
color15 #ffffff

# --- FONT SETTINGS ---
font_family      JetBrainsMono Nerd Font
font_size        14.0